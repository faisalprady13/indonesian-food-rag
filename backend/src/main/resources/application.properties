spring.application.name=backend
spring.datasource.url=${POSTGRES_DB_URL}
spring.datasource.username=${POSTGRES_DB_USER}
spring.datasource.password=${POSTGRES_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.client.registration.github.client-id=${GITHUB_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

frontend.url=${FRONTEND_URL}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.autoconfigure.exclude[0]=org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
spring.autoconfigure.exclude[3]=org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
spring.autoconfigure.exclude[4]=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
spring.autoconfigure.exclude[5]=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
spring.autoconfigure.exclude[6]=org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
spring.ai.openai.chat.model=gpt-5-mini
spring.ai.openai.embedding.model=text-embedding-3-small
app.encryption.password=${ENCRYPTION_PASSWORD}
app.encryption.salt=${ENCRYPTION_SALT}